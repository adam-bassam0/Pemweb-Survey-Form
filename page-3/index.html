<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <label for="kemampuan">Kemampuan yang paling kamu kuasai:</label>

    <select id="kemampuan" name="kemampuan">
        <option value="">Pilih kemampuan</option>
        <option value="teknologi">Teknologi</option>
        <option value="komunikasi">Komunikasi</option>
        <option value="seni">Seni dan Kreativitas</option>
        <option value="olahraga">Olahraga</option>
        <option value="akademik">Akademik</option>
    </select>

    <p>Skill yang kamu miliki:</p>

    <label>
        <input type="checkbox" name="skill" value="programming">
        Programming
    </label>

    <label>
        <input type="checkbox" name="skill" value="design">
        Design
    </label>

    <label>
        <input type="checkbox" name="skill" value="public-speaking">
        Public Speaking
    </label>

    <label>
        <input type="checkbox" name="skill" value="leadership">
        Leadership
    </label>

    <label>
        <input type="checkbox" name="skill" value="writing">
        Writing
    </label>

    <p>Seberapa baik kamu menguasai kemampuan tersebut?</p>

    <label>
        <input type="radio" name="level" value="pemula">
        Pemula
    </label>

    <label>
        <input type="radio" name="level" value="menengah">
        Menengah
    </label>

    <label>
        <input type="radio" name="level" value="mahir">
        Mahir
    </label>

    <label for="target">
        Kemampuan apa yang ingin kamu kembangkan?
    </label>

    <textarea
        id="target"
        name="target"
        placeholder="Ceritakan kemampuan yang ingin kamu kembangkan...">
    </textarea>

    <a href="../page2/index.html">Kembali</a>

    <button type="submit">
        Kirim Survey
    </button>
    
</body>
</html>
