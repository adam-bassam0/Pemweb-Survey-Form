<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey MInat dan Bakat</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header>
      <h1 id="title">Survey Minat dan Bakat</h1>
      <p id="description">Survey ini bertujuan untuk mengetahui minat dan bakat dari para peserta</p>

    </header>

    <form id="survey-form">

      <label id="name-label" for="nama">Nama</label>
      <input type="text" id="name" required
      placeholder="Michael" />
      
      <label id="email-label" for="email">Email</label>
      <input type="email" id="email" required
      placeholder="dudung@gmail.com" />

      <label id="number-label" for="number">Umur</label>
      <input type="number" id="number" min="1" max="100" required
      placeholder=17 />

      <p>Pekerjaan saat ini</p>
      
      <label >Status:</label>
      <select id="dropdown"> 
        <option value="pelajar">Pelajar
        </option>
        <option value="pekerja">Pekerja</option>
        <option value="pengangguran">Pengangguran</option>
      </select>

      <p>Pilih jenis kelamin:</p>
      <label>
      <input type="radio" name="gender" value="pria"  /> Pria
      </label>

      <label>
      <input type="radio" name="gender" value="wanita" /> Wanita
      </label>

      <label>
        <input  type="radio" name="gender" value="non binary">Non Binary
      </label>

      <p>Status Hubungan</p>
      <label>
      <input type="checkbox" name="status" value="jomblo"  /> Jomblo
      </label>

      <label>
      <input type="checkbox" name="status" value="pasangan" /> Memiliki Pasangan
      </label>

      <br><br>

      <button id="submit" type="submit">Selanjutnya</button>
    </form>
  </body>
</html>
