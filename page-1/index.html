<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey MInat dan Bakat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

  </head>

  <body>
    <header>
      <h1 id="title">Survey Minat dan Bakat</h1>
      <p id="description">Survey ini bertujuan untuk mengetahui minat dan bakat dari para peserta</p>

    </header>

    <form id="survey-form">

      <div class="mb-3">
        <label id="name-label" for="name" class="form-label">Nama</label>
        <input type="text" id="name" class="form-control" required
        placeholder="Michael" />
      </div>
      
      <div class="mb-3">
        <label id="email-label" for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required
        placeholder="dudung@gmail.com" />
      </div>

      <div class="mb-3">
        <label id="number-label" for="number" class="form-label">Umur</label>
        <input type="number" id="number" class="form-control" min="1" max="100" required
        placeholder=17 />
      </div>

      <p>Pekerjaan saat ini</p>
      
      <div class="mb-3">
        <label for="dropdown" class="form-label">Status:</label>
        <select id="dropdown" class="form-select"> 
          <option value="pelajar">Pelajar</option>
          <option value="pekerja">Pekerja</option>
          <option value="pengangguran">Pengangguran</option>
        </select>
      </div>

      <p>Pilih jenis kelamin:</p>
      <div class="gender-options mb-3">
        <label>
          <input type="radio" name="gender" value="pria"  /> Pria
        </label>

        <label>
          <input type="radio" name="gender" value="wanita" /> Wanita
        </label>

        <label>
          <input  type="radio" name="gender" value="non binary">Non Binary
        </label>
      </div>

      <p>Status Hubungan</p>
      <div class="mb-3">
        <label>
          <input type="checkbox" name="status" value="jomblo"  /> Jomblo
        </label>

        <label>
          <input type="checkbox" name="status" value="pasangan" /> Memiliki Pasangan
        </label>
      </div>

      <br><br>
      
      <a href="../page-2/main.html" class="btn btn-survey w-100">
        Selanjutnya
      </a>
    </form>
  </body>
</html>
